name: Build Zipped Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip mod source
        run: |
          unzip -o "*.zip" -d extracted_mod

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          GRADLEW_PATH=$(find extracted_mod -name "gradlew" | head -n 1)
          MOD_DIR=$(dirname "$GRADLEW_PATH")
          cd "$MOD_DIR"
          chmod +x gradlew
          ./gradlew build

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: |
            extracted_mod/**/build/libs/*.jar
            !extracted_mod/**/build/libs/*-sources.jar
            !extracted_mod/**/build/libs/*-dev.jar
            
