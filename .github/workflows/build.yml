name: Build Zipped Minecraft Mod

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Unzip mod source
        run: |
          unzip -o "*.zip" -d extracted_mod

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        run: |
          BUILD_FILE=$(find extracted_mod -name "build.gradle*" | head -n 1)
          if [ -z "$BUILD_FILE" ]; then
            echo "Error: Could not find build.gradle inside the zip! Files found:"
            find extracted_mod
            exit 1
          fi
          MOD_DIR=$(dirname "$BUILD_FILE")
          cd "$MOD_DIR"
          if [ -f "gradlew" ]; then
            chmod +x gradlew
            ./gradlew build
          else
            gradle build
          fi

      - name: Upload compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: compiled-mod
          path: |
            extracted_mod/**/build/libs/*.jar
            !extracted_mod/**/build/libs/*-sources.jar
            !extracted_mod/**/build/libs/*-dev.jar
            
